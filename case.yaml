caseName: "demo-freezing"

time:
    startDate: "2000-01-01T00:00:00.000"
    endDate: "2000-01-30T00:00:00.000"
    dtSeconds: 3600 # шаг расчёта (сек)
    saveEverySeconds: 86400 # шаг сохранения (сек)

grid:
    axes:
        X:
            - from: 0.0
              to: 50.0
              step: 1.0
        Y:
            - from: 0.0
              to: 50.0
              step: 1.0
        Z:
            - from: 0.0
              to: 50.0
              step: 1.0

boundaryConditions:
    # тип граничного условия (FIRST_KIND, SECOND_KIND, THIRD_KIND)
    # температура на границе (T, [°C])
    # поток тепла на границе (q, [Вт/м2])
    # коэффициент теплообмена на границе (a, [Вт/(м2*К)])
    definitions:
        bc_cold:
            type: FIRST_KIND
            temperature:
                JANUARY:  -15.0
                FEBRUARY: -15.0
                MARCH:    -15.0
                APRIL:    -15.0
                MAY:      -15.0
                JUNE:     -15.0
                JULY:     -15.0
                AUGUST:   -15.0
                SEPTEMBER: -15.0
                OCTOBER:   -15.0
                NOVEMBER:  -15.0
                DECEMBER:  -15.0
    field:
        faces:
            Z_MAX:
                default: bc_cold
                rules: []
            Z_MIN:
                default: bc_cold
                rules: []
            X_MAX:
                default: bc_cold
                rules: []
            X_MIN:
                default: bc_cold
                rules: []
            Y_MAX:
                default: bc_cold
                rules: []
            Y_MIN:
                default: bc_cold
                rules: []

materials:
    # λth - теплопроводность грунта в талом состоянии [Вт/(м·К)]
    # λfz - теплопроводность грунта в мёрзлом состоянии [Вт/(м·К)]
    # Cth - удельная теплоёмкость грунта в талом состоянии [Дж/(м3·К)]
    # Cfz - удельная теплоёмкость грунта в мёрзлом состоянии [Дж/(м3·К)]
    # L - удельная теплота фазового перехода [Дж/м3]
    # Tbf - температура замерзания грунта [°C]
    definitions:
        # Песок (влажный, плотный)
        m1:
            thermalConductivityThawed: 1.8
            thermalConductivityFrozen: 2.5
            heatCapacityThawed: 2100000
            heatCapacityFrozen: 1800000
            phaseTransitionsHeat: 40000000
            freezingTemperature: 0
            
        # Глина (влажная, пластичная)
        m2:
            thermalConductivityThawed: 1.2
            thermalConductivityFrozen: 2.0
            heatCapacityThawed: 2800000
            heatCapacityFrozen: 2000000
            phaseTransitionsHeat: 80000000
            freezingTemperature: -0.5
    field:
        default: m1
        rules:
            - name: "middle-box"
              selector:
                  type: BOX
                  min: [1, 3, 3]
                  max: [8, 6, 6]
              value: m2

temperature:
    definitions:
        temp1:
            type: CONSTANT
            temperature: -2.0
        temp2:
            type: CONSTANT
            temperature: 1.0
    field:
        default: temp1
        rules:
            - name: "warm"
              selector:
                  type: Z_RANGE
                  zMin: 4
                  zMax: 6
              value: temp2

profiles:
    - name: "line-y"
      pointA: [25.0, 0.0, 0.0]
      pointB: [25.0, 50.0, 0.0]
    - name: "line-x"
      pointA: [0.0, 25.0, 0.0]
      pointB: [50.0, 25.0, 0.0]

samplePoints:
    - name: "center"
      point: [25.0, 25.0, 25.0]
    - name: "bottom"
      point: [25.0, 25.0, 48.0]
