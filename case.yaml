caseName: "demo-freezing"

time:
    dtSeconds: 3600 # шаг расчёта (сек)
    saveEverySeconds: 18000 # шаг сохранения (сек)
    totalSeconds: 180000 # длительность расчёта (сек) - неделя

grid:
    axes:
        X:
            - from: 0.0
              to: 10.0
              step: 1.0
        Y:
            - from: 0.0
              to: 10.0
              step: 1.0
        Z:
            - from: 0.0
              to: 10.0
              step: 1.0

boundaryConditions:
    # тип граничного условия (FIRST_KIND, SECOND_KIND, THIRD_KIND)
    # температура на границе (T, [°C])
    # поток тепла на границе (q, [Вт/м2])
    # коэффициент теплообмена на границе (a, [Вт/(м3*К)])
    definitions:
        bc_cold:
            type: FIRST_KIND
            temperature: -15.0
        bc_warm:
            type: FIRST_KIND
            temperature: 2.0
    field:
        faces:
            Z_MAX:
                default: bc_cold
                rules: []
            Z_MIN:
                default: bc_warm
                rules: []
            X_MAX:
                default: bc_cold
                rules: []
            X_MIN:
                default: bc_cold
                rules: []
            Y_MAX:
                default: bc_cold
                rules: []
            Y_MIN:
                default: bc_cold
                rules: []

materials:
    # λth - теплопроводность грунта в талом состоянии [Вт/(м·К)]
    # λfz - теплопроводность грунта в мёрзлом состоянии [Вт/(м·К)]
    # Cth - удельная теплоёмкость грунта в талом состоянии [Дж/(м3·К)]
    # Cfz - удельная теплоёмкость грунта в мёрзлом состоянии [Дж/(м3·К)]
    # L - удельная теплота фазового перехода [Дж/м3]
    # Tbf - температура замерзания грунта [°C]
    definitions:
        m1:
            thermalConductivityThawed: 0.570
            thermalConductivityFrozen: 2.220
            heatCapacityThawed: 4200
            heatCapacityFrozen: 2100
            phaseTransitionsHeat: 334000
            freezingTemperature: 0
        m2:
            thermalConductivityThawed: 1.000
            thermalConductivityFrozen: 2.500
            heatCapacityThawed: 4500
            heatCapacityFrozen: 2500
            phaseTransitionsHeat: 300000
            freezingTemperature: -1
        material3:
            thermalConductivityThawed: 1.500
            thermalConductivityFrozen: 3.500
            heatCapacityThawed: 4000
            heatCapacityFrozen: 2000
            phaseTransitionsHeat: 100000
            freezingTemperature: -0.5
    field:
        default: m1
        rules:
            - name: "middle-box"
              selector:
                  type: BOX
                  min: [1, 3, 3]
                  max: [8, 6, 6]
              value: m2

temperature:
    definitions:
        temp1:
            type: CONSTANT
            temperature: -2.0
        temp2:
            type: CONSTANT
            temperature: 1.0
    field:
        default: temp1
        rules:
            - name: "warm"
              selector:
                  type: Z_RANGE
                  zMin: 4
                  zMax: 6
              value: temp2

profiles:
    - name: "line-y"
      pointA: [5.0, 0.0, 0.0]
      pointB: [5.0, 10.0, 0.0]
    - name: "line-x"
      pointA: [0.0, 5.0, 0.0]
      pointB: [10.0, 5.0, 0.0]

samplePoints:
    - name: "center"
      point: [5.0, 5.0, 5.0]
