caseName: 'line5'

config:
    stepCalculatorKey: 'ExplicitStefanEnthalpy'
    materialModelKey: 'StefanEnthalpy'
    timeFormat: HOURS
    numberFormat:
        fractionDigits: 2
        roundingMode: HALF_UP

time:
    startDate: '2000-01-01T00:00:00'
    endDate: '2100-01-01T00:00:00'
    dtSeconds: 3600 # шаг расчёта (сек)

grid:
    axes:
        X:
            - from: 0.0
              to: 1.0
              step: 1.0
        Y:
            - from: 0.0
              to: 1.0
              step: 1.0
        Z:
            - from: 0.0
              to: 50.0
              step: 1.0

boundaryConditions:
    # тип граничного условия (FIRST_KIND, SECOND_KIND, THIRD_KIND)
    # температура на границе (T, [°C])
    # поток тепла на границе (q, [Вт/м2])
    # коэффициент теплообмена на границе (a, [Вт/(м2*К)])
    definitions:
        bc_cold:
            type: FIRST_KIND
            temperature:
                JANUARY: -10
                FEBRUARY: -10
                MARCH: -10
                APRIL: -10
                MAY: -10
                JUNE: -10
                JULY: -10
                AUGUST: -10
                SEPTEMBER: -10
                OCTOBER: -10
                NOVEMBER: -10
                DECEMBER: -10
        bc_neutral:
            type: SECOND_KIND
            heatFlow:
                JANUARY: 0
                FEBRUARY: 0
                MARCH: 0
                APRIL: 0
                MAY: 0
                JUNE: 0
                JULY: 0
                AUGUST: 0
                SEPTEMBER: 0
                OCTOBER: 0
                NOVEMBER: 0
                DECEMBER: 0
    field:
        faces:
            Z_MAX:
                default: bc_neutral
                rules: []
            Z_MIN:
                default: bc_cold
                rules: []
            X_MAX:
                default: bc_neutral
                rules: []
            X_MIN:
                default: bc_neutral
                rules: []
            Y_MAX:
                default: bc_neutral
                rules: []
            Y_MIN:
                default: bc_neutral
                rules: []

materials:
    # λth - теплопроводность грунта в талом состоянии [Вт/(м·К)]
    # λfz - теплопроводность грунта в мёрзлом состоянии [Вт/(м·К)]
    # Cth - удельная теплоёмкость грунта в талом состоянии [Дж/(м3·К)]
    # Cfz - удельная теплоёмкость грунта в мёрзлом состоянии [Дж/(м3·К)]
    # L - удельная теплота фазового перехода [Дж/м3]
    # Tbf - температура замерзания грунта [°C]
    definitions:
        # Песок (влажный, плотный)
        m1:
            thermalConductivityThawed: 1.95
            thermalConductivityFrozen: 2.86
            heatCapacityThawed: 2630000
            heatCapacityFrozen: 1780000
            phaseTransitionsHeat: 137030000
            freezingTemperature: -0.30
    field:
        default: m1

temperature:
    definitions:
        temp1:
            type: CONSTANT
            temperature: 10.0
        temp2:
            type: CONSTANT
            temperature: 1.0
    field:
        default: temp1

profiles:
    - name: 'line-x'
      saveStep: 100000
      pointA: [0.5, 0.0, 0.0]
      pointB: [0.5, 1.0, 0.0]

samplePoints:
    - name: 'center'
      saveStep: 730 # шаг сохранения (кратен)
      point: [0.5, 0.5, 24.5]
