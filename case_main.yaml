caseName: 'main'

config:
    stepCalculatorKey: 'ExplicitStefanEnthalpy'
    materialModelKey: 'StefanEnthalpy'
    timeFormat: MOUNTHS
    numberFormat:
        fractionDigits: 2
        roundingMode: HALF_UP
        
time:
    startDate: '2000-01-01T00:00:00'
    endDate: '2070-01-01T00:00:00'
    dtSeconds: 3600 # шаг расчёта (сек)

grid:
    axes:
        X:
            - from: 0.0
              to: 30.0
              step: 0.5
            - from: 30.0
              to: 130.0
              step: 5.0
            - from: 130.0
              to: 160.0
              step: 0.5
        Y:
            - from: 0.0
              to: 30.0
              step: 0.5
            - from: 30.0
              to: 130.0
              step: 5.0
            - from: 130.0
              to: 160.0
              step: 0.5
        Z:
            - from: 0.0
              to: 1.0
              step: 0.1
            - from: 1.0
              to: 55.0
              step: 0.5
            - from: 55.0
              to: 100.0
              step: 5.0

boundaryConditions:
    # тип граничного условия (FIRST_KIND, SECOND_KIND, THIRD_KIND)
    # температура на границе (T, [°C])
    # поток тепла на границе (q, [Вт/м2])
    # коэффициент теплообмена на границе (a, [Вт/(м2*К)])
    definitions:
        bc_buttom:
            type: FIRST_KIND
            temperature:
                JANUARY: -3
                FEBRUARY: -3
                MARCH: -3
                APRIL: -3
                MAY: -3
                JUNE: -3
                JULY: -3
                AUGUST: -3
                SEPTEMBER: -3
                OCTOBER: -3
                NOVEMBER: -3
                DECEMBER: -3
        bc_side:
            type: SECOND_KIND
            heatFlow:
                JANUARY: 0
                FEBRUARY: 0
                MARCH: 0
                APRIL: 0
                MAY: 0
                JUNE: 0
                JULY: 0
                AUGUST: 0
                SEPTEMBER: 0
                OCTOBER: 0
                NOVEMBER: 0
                DECEMBER: 0
        bc_climate:
            type: THIRD_KIND
            ambientTemperature:
                JANUARY: 1.1
                FEBRUARY: 1.1
                MARCH: 1.1
                APRIL: 1.1
                MAY: 1.1
                JUNE: 4
                JULY: 4
                AUGUST: 4
                SEPTEMBER: 4
                OCTOBER: 1.1
                NOVEMBER: 1.1
                DECEMBER: 1.1
            heatTransferCoefficient:
                JANUARY: -19.8
                FEBRUARY: -19.3
                MARCH: -15.1
                APRIL: -9.4
                MAY: -3.6
                JUNE: 3.9
                JULY: 9
                AUGUST: 7.8
                SEPTEMBER: 4.9
                OCTOBER: -1.6
                NOVEMBER: -10.9
                DECEMBER: -14.6

    field:
        faces:
            Z_MAX:
                default: bc_buttom
                rules: []
            Z_MIN:
                default: bc_climate
                rules: []
            X_MAX:
                default: bc_side
                rules: []
            X_MIN:
                default: bc_side
                rules: []
            Y_MAX:
                default: bc_side
                rules: []
            Y_MIN:
                default: bc_side
                rules: []

materials:
    # λth - теплопроводность грунта в талом состоянии [Вт/(м·К)]
    # λfz - теплопроводность грунта в мёрзлом состоянии [Вт/(м·К)]
    # Cth - удельная теплоёмкость грунта в талом состоянии [Дж/(м3·К)]
    # Cfz - удельная теплоёмкость грунта в мёрзлом состоянии [Дж/(м3·К)]
    # L - удельная теплота фазового перехода [Дж/м3]
    # Tbf - температура замерзания грунта [°C]
    definitions:
        # m III2-3 супесь
        sandy_loam:
            thermalConductivityThawed: 1.47
            thermalConductivityFrozen: 2.22
            heatCapacityThawed: 2730000
            heatCapacityFrozen: 1970000
            phaseTransitionsHeat: 148320000
            freezingTemperature: -0.1    

        # m III2-3 суглинки
        loam:
            thermalConductivityThawed: 0.98
            thermalConductivityFrozen: 1.13
            heatCapacityThawed: 2950000
            heatCapacityFrozen: 2310000
            phaseTransitionsHeat: 125810000
            freezingTemperature: -1.36

        # пластовый лёд
        ice:
            thermalConductivityThawed: 0.57
            thermalConductivityFrozen: 2.22
            heatCapacityThawed: 4200000
            heatCapacityFrozen: 2100000
            phaseTransitionsHeat: 335000000
            freezingTemperature: 0

        # pm III1 пески
        sand:
            thermalConductivityThawed: 1.95
            thermalConductivityFrozen: 2.86
            heatCapacityThawed: 2630000
            heatCapacityFrozen: 1780000
            phaseTransitionsHeat: 137030000
            freezingTemperature: -0.3

        # mg II2-4 суглинок+глина
        clay_loam:
            thermalConductivityThawed: 1.33
            thermalConductivityFrozen: 1.74
            heatCapacityThawed: 2800000
            heatCapacityFrozen: 2320000
            phaseTransitionsHeat: 111600000
            freezingTemperature: -1.97

        # mg II2-4 суглинок+песок
        clay_sand:
            thermalConductivityThawed: 1.49
            thermalConductivityFrozen: 1.59
            heatCapacityThawed: 3010000
            heatCapacityFrozen: 2330000
            phaseTransitionsHeat: 104270000
            freezingTemperature: -1.97

        # Отходы бурового раствора
        mud:
            thermalConductivityThawed: 1.014
            thermalConductivityFrozen: 1.783
            heatCapacityThawed: 3410000
            heatCapacityFrozen: 2313000
            phaseTransitionsHeat: 174000000
            freezingTemperature: -0.52

    field:
        default: clay_sand
        rules:
            - name: 'layer1'
              value: sandy_loam
              selector: 
                type: Z_RANGE
                zMin: 0
                zMax: 6.5
            - name: 'layer2'
              value: loam
              selector: 
                type: Z_RANGE
                zMin: 6.5
                zMax: 28.5
            - name: 'layer3'
              value: ice
              selector: 
                type: Z_RANGE
                zMin: 28.5
                zMax: 32.5
            - name: 'layer4'
              value: sand
              selector: 
                type: Z_RANGE
                zMin: 32.5
                zMax: 53.5
            - name: 'layer5'
              value: clay_loam
              selector: 
                type: Z_RANGE
                zMin: 53.5
                zMax: 70.0
              
